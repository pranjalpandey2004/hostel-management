unit: protected-user-api
bindings:
  - type: route-declaration
    name: "GET /protected"
    source_loc: "backend/src/app.js:25"
    target: inline protected handler
    must_appear_in_target: true
    notes: "Uses authMiddleware."
runtime_config:
  - key: JWT_SECRET
    source_loc: "backend/src/middleware/auth.middleware.js:13"
    source: env
    default_value: ""
    must_appear_in_target: true
    notes: "Must match auth-api signing secret."
