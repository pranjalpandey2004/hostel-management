unit: auth-api
side_effects:
  - source_loc: "backend/src/controllers/auth.controller.js:21"
    effect: "Hash the submitted password before persisting the user."
    must_preserve: true
  - source_loc: "backend/src/controllers/auth.controller.js:25"
    effect: "Create a User document with role user."
    must_preserve: true
  - source_loc: "backend/src/controllers/auth.controller.js:33"
    effect: "Issue a one-day JWT after registration or login."
    must_preserve: true
branches:
  - source_loc: "backend/src/controllers/auth.controller.js:14"
    condition: "A user with the submitted email already exists."
    behavior: "Return HTTP 400 with User already exists."
    must_preserve: true
  - source_loc: "backend/src/controllers/auth.controller.js:60"
    condition: "Email is not found or password comparison fails."
    behavior: "Return HTTP 400 with Invalid credentials."
    must_preserve: true
error_paths:
  - source_loc: "backend/src/controllers/auth.controller.js:40"
    trigger: "Unexpected registration or login failure."
    outcome: "Return HTTP 500 with message."
    contract: "HTTP 500 JSON { message }"
    must_preserve: true
concurrency:
  model: async
  tx_boundary:
    source_loc: "backend/src/controllers/auth.controller.js:7"
    scope: "No explicit database transaction; registration check and create are separate operations."
    isolation: unspecified
    must_preserve: true
